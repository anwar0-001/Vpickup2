name: Build Vpickup2 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Install Android export dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y openjdk-17-jdk unzip wget
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Import project resources
        run: godot --headless --editor --path . --quit
      - name: Validate project scripts
        run: godot --headless --path . --quit
      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Vpickup2.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vpickup2-Android-APK
          path: build/Vpickup2.apk
          if-no-files-found: error
          retention-days: 14
