name: Build Vpickup2 Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Prepare preinstalled Android export toolchain
        run: |
          godot --version
          java -version
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a /root/.local/share/godot/export_templates/4.7.2.stable/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -x "$ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager"
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Import project resources
        run: godot --headless --editor --path . --quit
      - name: Validate project scripts
        run: godot --headless --path . --quit
      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Vpickup2.apk
          test -s build/Vpickup2.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vpickup2-Android-APK
          path: build/Vpickup2.apk
          if-no-files-found: error
          retention-days: 14
