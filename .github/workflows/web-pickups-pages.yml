name: Deploy Pickups Browser Game

on:
  pull_request:
    paths:
      - "web-pickups/**"
      - "scripts/check-web.mjs"
      - ".github/workflows/web-pickups-pages.yml"
  push:
    branches: [main]
    paths:
      - "web-pickups/**"
      - "scripts/check-web.mjs"
      - ".github/workflows/web-pickups-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pickups-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check web-pickups/game.js
      - name: Check web game files
        run: node scripts/check-web.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-pickups
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
