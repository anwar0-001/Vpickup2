function audioInit(){if(audio)return;try{audio=new AudioContext();let osc=audio.createOscillator(),gain=audio.createGain();osc.type="sawtooth";osc.frequency.value=55;gain.gain.value=.0001;osc.connect(gain);gain.connect(audio.destination);osc.start();engineOsc={osc,gain};}catch{}}

function hud(){ $("money").textContent=Math.floor(save.money)+" ◈";$("fuel").textContent=Math.round(vehicle.fuel)+"%";$("speed").textContent=Math.round(Math.abs(vehicle.speed)*3.6)+" km/h";$("damage").textContent=Math.round(vehicle.damage)+"%";let h=Math.floor(dayClock/60)%24,m=Math.floor(dayClock%60);$("clock").textContent=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");$("objective").textContent=mission?mission.label:"تجول أو ابدأ عقداً من المتجر"}
function overlay(title,body,buttons){$("overlay").classList.remove("hide");$("panel").innerHTML='<div class="logo">'+title+'</div><div class="sub">'+body+'</div>'+buttons}
function mainMenu(){state="menu";overlay("PICKUP<br>OPEN WORLD", "مدينة مفتوحة إجرائية، قيادة وتوصيل ومركبات أصلية. احفظ تقدمك محلياً على هذا الجهاز.<br><br>الرصيد: "+Math.floor(save.money)+" ◈ · أفضل نتيجة: "+save.high, '<button class="primary" id="start">دخول العالم</button><br><button class="secondary" id="garageMenu">الكراج والمتجر</button> <button class="secondary" id="settingsMenu">الجودة والإعدادات</button>')}
function start(){state="play";$("overlay").classList.add("hide");if(!mission)createMission();audioInit();hud()}
function createMission(){let t=choose(cargoTypes),x=rand(-370,370),z=rand(-370,370);if(Math.abs(x%100)<18)x+=28;if(Math.abs(z%100)<18)z+=28;mission={x,z,type:t,stage:"pickup",label:"استلم "+t.name+" ثم سلّمه في مركز التوصيل",reward:t.value+100,fragile:t.fragile,deadline:t.name==="عاجل"?150:260,package:null};mission.package=spawnCargo(x,z,t);toast("عقد جديد: "+mission.label);hud()}
const shopItems=[["engine","محرك مطوّر","سرعة وتسارع أفضل",260],["grip","إطارات رياضية","تماسك أعلى في المنعطفات",210],["tank","خزان أكبر","تقليل استهلاك الوقود",180],["cargo","صندوق حمولة","زيادة سعة الطرود",240]];
function garage(){state="garage";let html='<p>الرصيد: '+Math.floor(save.money)+' ◈</p><div class="item"><div><b>نوع المركبة</b><small>تبديل المركبة يغير السرعة والحمولة</small></div><button data-car="1">تبديل ←</button></div>';for(let a of shopItems)html+='<div class="item"><div><b>'+a[1]+'</b><small>'+a[2]+' · المستوى '+save.upgrades[a[0]]+'</small></div><button data-buy="'+a[0]+'" data-cost="'+(a[3]*(save.upgrades[a[0]]+1))+'">'+(a[3]*(save.upgrades[a[0]]+1))+' ◈</button></div>';html+='<button class="primary" id="back">عودة</button>';overlay("الكراج والمتجر",html,"")}
function settings(){state="settings";let names=["Low","Medium","High"];overlay("إعدادات الرسوم","الجودة الحالية: "+names[quality]+'<br>اختر مستوى يناسب هاتفك.', '<button class="secondary" data-quality="0">Low</button><button class="secondary" data-quality="1">Medium</button><button class="secondary" data-quality="2">High</button><br><button class="secondary" id="fpsToggle">إظهار FPS</button><br><button class="primary" id="back">عودة</button>')}
$("panel").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.id==="start")start();if(b.id==="garageMenu")garage();if(b.id==="settingsMenu")settings();if(b.id==="back")mainMenu();if(b.id==="fpsToggle"){showFPS=!showFPS;$("fps").style.display=showFPS?"block":"none"}if(b.dataset.quality!==undefined){quality=+b.dataset.quality;save.quality=quality;renderer.setPixelRatio(Math.min(devicePixelRatio,quality===0?0.85:quality===1?1.2:1.6));renderer.shadowMap.enabled=quality>0;rain.visible=weather==="rain"&&quality>0;persist();settings()}if(b.dataset.car){save.vehicle=(save.vehicle+1)%4;vehicleBuild();toast("المركبة: "+player.userData.cfg.name);garage()}if(b.dataset.buy){let k=b.dataset.buy,c=+b.dataset.cost;if(save.money<c){toast("الرصيد غير كافٍ");return}save.money-=c;save.upgrades[k]++;persist();garage();beep(740)}});
function pause(){if(state==="play"){overlay("إيقاف مؤقت","اللعبة متوقفة. تقدمك يُحفظ تلقائياً.",'<button class="primary" id="resume">متابعة</button><br><button class="secondary" id="garageMenu">الكراج</button> <button class="secondary" id="settingsMenu">الإعدادات</button>')}else if(state==="paused"){state="play";$("overlay").classList.add("hide")}}
$("pause").onclick=()=>{if(state==="play"){state="paused";pause()}else if(state==="paused"){state="play";$("overlay").classList.add("hide")}};
$("panel").addEventListener("click",e=>{if(e.target.id==="resume"){state="play";$("overlay").classList.add("hide")}});
$("mapBtn").onclick=()=>{$("map").classList.add("show");drawMap()};$("closeMap").onclick=()=>$("map").classList.remove("show");
$("cameraBtn").onclick=()=>{cameraMode=(cameraMode+1)%3;toast(["مطاردة","داخل المركبة","سينمائية"][cameraMode])};
$("qualityBtn").onclick=()=>{quality=(quality+1)%3;save.quality=quality;renderer.setPixelRatio(Math.min(devicePixelRatio,quality===0?.85:quality===1?1.2:1.6));renderer.shadowMap.enabled=quality>0;persist();$("qualityBtn").textContent="Q: "+["L","M","H"][quality]};
$("lights").onclick=()=>{save.lights=!save.lights;toast(save.lights?"الأضواء تعمل":"الأضواء مطفأة")};
$("horn").onclick=()=>beep(210,.22);$("radio").onclick=()=>{radioOn=!radioOn;beep(radioOn?520:240);toast(radioOn?"الراديو يعمل":"الراديو متوقف")};
function bindHold(id,key){let el=$(id);el.addEventListener("pointerdown",e=>{e.preventDefault();controls[key]=true;el.setPointerCapture(e.pointerId)});["pointerup","pointercancel","lostpointercapture"].forEach(ev=>el.addEventListener(ev,()=>controls[key]=false))}
bindHold("gas","gas");bindHold("brake","brake");bindHold("hand","hand");
let joy=$("steer"),knob=$("knob"),joyId=null;function joyMove(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y),m=43;if(l>m){x=x/l*m;y=y/l*m}controls.steer=x/m;knob.style.transform="translate("+x+"px,"+y+"px)"}function joyEnd(){joyId=null;controls.steer=0;knob.style.transform="translate(0,0)"}joy.addEventListener("pointerdown",e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener("pointermove",e=>{if(e.pointerId===joyId)joyMove(e)});joy.addEventListener("pointerup",joyEnd);joy.addEventListener("pointercancel",joyEnd);
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.key==="e")interact();if(e.key==="m"){$("map").classList.toggle("show");drawMap()}if(e.key==="Escape"&&state==="play"){$("pause").click()}});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
$("interact").onclick=interact;
function nearestService(){let found=null,d=18;for(let s of city.shops){let n=Math.hypot(player.position.x-s.x,player.position.z-s.z);if(n<d){d=n;found=s}}return found}
function interact(){if(state!=="play")return;let s=nearestService();if(s){if(s.type==="fuel"){let cost=Math.ceil((100-vehicle.fuel)*1.8);if(save.money>=cost){save.money-=cost;vehicle.fuel=100;toast("تم ملء خزان الوقود")}else toast("لا تملك ما يكفي للوقود")}else if(s.type==="repair"){let cost=Math.ceil(vehicle.damage*2.2);if(save.money>=cost){save.money-=cost;vehicle.damage=0;vehicle.broken=false;toast("تم إصلاح المركبة")}else toast("لا تملك ما يكفي للإصلاح")}else garage();persist();hud();return}
if(mission&&mission.stage==="pickup"&&Math.hypot(player.position.x-mission.x,player.position.z-mission.z)<10){if(mission.package){packageRoot.remove(mission.package.group);packages=packages.filter(p=>p!==mission.package)}mission.stage="deliver";mission.label="الطرد معك — عد إلى مركز التوصيل";toast("تم استلام الطرد! اتجه إلى مركز التوصيل");hud();beep(620);return}if(mission&&mission.stage==="deliver"&&Math.hypot(player.position.x-40,player.position.z-40)<18){let broken=mission.fragile&&vehicle.damage>35;if(broken){toast("الطرد الهش تضرر — المكافأة أقل");save.money+=Math.round(mission.reward*.25)}else{save.money+=mission.reward;score+=mission.reward;toast("توصيل ناجح! +"+mission.reward+" ◈")}mission=null;persist();createMission();hud();beep(850);return}
if(Math.hypot(player.position.x-depot.x,player.position.z-depot.z)<22){garage();return}toast("اقترب من محطة أو كراج أو موقع المهمة")}
function physics(dt){let cfg=player.userData.cfg;let gas=controls.gas||keys.w||keys.arrowup,brake=controls.brake||keys.s||keys.arrowdown,steer=controls.steer+(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0);steer=clamp(steer,-1,1);
let forward=new THREE.Vector3(-Math.sin(player.rotation.y),0,-Math.cos(player.rotation.y));let grip=1+save.upgrades.grip*.13,load=carried.length?Math.max(.55,1-carried.length/(maxCargo()+2)*.32):1;let engine=(cfg.speed+save.upgrades.engine*3)*load*(1-vehicle.damage/150);let accel=gas?engine/16:0;let drag=vehicle.speed*.32;let brakeForce=brake?Math.sign(vehicle.speed)*Math.min(Math.abs(vehicle.speed),19*dt):0;
vehicle.speed+=accel*dt-drag*dt-brakeForce;if(!gas&&!brake)vehicle.speed*=Math.pow(.985,dt*60);if(controls.hand){vehicle.speed*=Math.pow(.94,dt*60);vehicle.slip=steer*Math.abs(vehicle.speed)*.06}else vehicle.slip*=Math.pow(.9,dt*60);
vehicle.speed=clamp(vehicle.speed,-9,engine*(1-vehicle.damage/130));let steerFactor=clamp(Math.abs(vehicle.speed)/7,.25,1.2);vehicle.steer+=(steer-vehicle.steer)*Math.min(1,dt*5);player.rotation.y-=vehicle.steer*dt*(1.7+steerFactor*.8)*Math.sign(vehicle.speed||1)/grip;player.rotation.y+=vehicle.slip*dt;
let vel=new THREE.Vector3(-Math.sin(player.rotation.y),0,-Math.cos(player.rotation.y));player.position.addScaledVector(vel,vehicle.speed*dt);player.position.x=clamp(player.position.x,-480,480);player.position.z=clamp(player.position.z,-480,480);
vehicle.rpm=900+Math.abs(vehicle.speed)*230;vehicle.gear=clamp(Math.floor(Math.abs(vehicle.speed)/10)+1,1,6);vehicle.fuel=Math.max(0,vehicle.fuel-dt*(.012+Math.abs(vehicle.speed)*.0008)*(1-save.upgrades.tank*.12));if(vehicle.fuel<=0)vehicle.speed*=Math.pow(.94,dt*60);
for(let o of city.obstacles){let dx=player.position.x-o.x,dz=player.position.z-o.z,d=Math.hypot(dx,dz),min=o.r+1.7;if(d<min){let nx=dx/(d||1),nz=dz/(d||1);player.position.x=o.x+nx*min;player.position.z=o.z+nz*min;vehicle.damage=clamp(vehicle.damage+Math.abs(vehicle.speed)*.025,0,100);vehicle.speed*=-.25;vibrate(45)}}for(let ped of city.peds){let d=Math.hypot(player.position.x-ped.g.position.x,player.position.z-ped.g.position.z);if(d<1.65&&Math.abs(vehicle.speed)>2){if(elapsed-lastFine>3){save.money=Math.max(0,save.money-75);lastFine=elapsed;toast("مخالفة اصطدام بمشاة: -75 ◈");vibrate(90)}ped.dir+=Math.PI;vehicle.damage=clamp(vehicle.damage+2,0,100);vehicle.speed*=.45}}for(let sig of signals){let d=Math.hypot(player.position.x-(sig.x+9),player.position.z-(sig.z+9));if(d<5&&Math.abs(vehicle.speed)>5&&sig.lamp.material.color.getHex()===0xe34b45&&elapsed-lastFine>3){save.money=Math.max(0,save.money-35);lastFine=elapsed;toast("تجاوز إشارة حمراء: -35 ◈")}}
for(let car of city.traffic){let d=player.position.distanceTo(car.g.position);if(d<3.2){vehicle.damage=clamp(vehicle.damage+Math.abs(vehicle.speed)*.07,0,100);vehicle.speed*=-.3;car.speed*=.45;vibrate(70);beep(120,.18)}}
if(vehicle.damage>90)vehicle.broken=true;
vehicle.fuel=clamp(vehicle.fuel,0,100);
player.position.y=Math.sin(elapsed*10)*Math.min(.04,Math.abs(vehicle.speed)*.001);
let bed=player.position.clone().add(new THREE.Vector3(0,1.3,1.8).applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y));cargoMeshes.forEach((c,i)=>{c.position.set(bed.x,bed.y,bed.z);c.rotation.y=player.rotation.y});
let speed=Math.abs(vehicle.speed);if(engineOsc&&audio){engineOsc.osc.frequency.setTargetAtTime(48+vehicle.rpm/95,audio.currentTime,.08);engineOsc.gain.gain.setTargetAtTime(muted?0:.008+speed*.0005,audio.currentTime,.1)}
}
function updateTraffic(dt){for(let c of city.traffic){let g=c.g;let signal=signals.find(s=>Math.hypot(s.x-g.position.x,s.z-g.position.z)<10);let stop=signal&&signal.lamp.material.color.getHex()===0xe34b45;let v=stop?0:c.speed*c.dir*dt;if(c.axis==="x"){g.position.x+=v;g.rotation.y=c.dir>0?-Math.PI/2:Math.PI/2;if(g.position.x>440)g.position.x=-440;if(g.position.x< -440)g.position.x=440}else{g.position.z+=v;g.rotation.y=c.dir>0?Math.PI:0;if(g.position.z>440)g.position.z=-440;if(g.position.z< -440)g.position.z=440}if(g.position.distanceTo(player.position)<11)c.speed=Math.max(4,c.speed*.97);else c.speed=Math.min(16,c.speed+.03)}}
function updatePeds(dt){for(let p of city.peds){let d=Math.hypot(player.position.x-p.g.position.x,player.position.z-p.g.position.z);if(d<9){p.wait=.6;p.dir=Math.atan2(p.g.position.x-player.position.x,p.g.position.z-player.position.z)}if(p.wait>0)p.wait-=dt;else{p.g.position.x+=Math.sin(p.dir)*p.speed*dt;p.g.position.z+=Math.cos(p.dir)*p.speed*dt}if(Math.abs(p.g.position.x)>430||Math.abs(p.g.position.z)>430)p.dir+=Math.PI;p.g.rotation.y=p.dir}}
function updateSignals(){for(let s of signals){let green=Math.sin(elapsed*.22+s.phase)>-.2;s.lamp.material.color.setHex(green?0x38d27b:0xe34b45)}}
function updateWeather(dt){weatherClock+=dt;if(weatherClock>85){weatherClock=0;weather=choose(["clear","clear","fog","rain"]);toast({clear:"الطقس صافٍ",fog:"ضباب كثيف",rain:"بدأ المطر"}[weather]);rain.visible=weather==="rain"&&quality>0;scene.fog.density=weather==="fog"?.006:weather==="rain"?.0035:.0019;mats.road.roughness=weather==="rain"?.28:.94;mats.road.metalness=weather==="rain"?.22:0;scene.fog.color.setHex(weather==="fog"?0x9caeaf:weather==="rain"?0x586b79:0x91b8ce);scene.background.setHex(weather==="rain"?0x586b79:weather==="fog"?0x9caeaf:0x91b8ce)}
if(rain.visible){let a=rainGeo.attributes.position;for(let i=0;i<rainCount;i++){a.array[i*3]+=0;a.array[i*3+1]-=25*dt;a.array[i*3+2]+=7*dt;if(a.array[i*3+1]<0){a.array[i*3+1]=rand(20,35);a.array[i*3]=rand(-45,45);a.array[i*3+2]=rand(-45,45)}}a.needsUpdate=true;rain.position.set(player.position.x,0,player.position.z)}
}
function updateDay(dt){dayClock=(dayClock+dt*.5)%(24*60);let phase=(dayClock/1440)*Math.PI*2,light=Math.max(.12,Math.sin(phase-Math.PI/2)*.8+.35);sun.position.set(Math.cos(phase)*150,Math.max(12,Math.sin(phase)*180),70);sun.intensity=light*2;hemi.intensity=.45+light;sun.color.setHSL(.1,.35,clamp(.65+light*.1,.4,.8));if(save.lights||light<.24){sun.intensity*=.8}}
function cameraUpdate(dt){let pos=player.position.clone(),behind=new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));let target;if(cameraMode===1){target=pos.clone().add(new THREE.Vector3(0,2.15,0)).addScaledVector(behind,-.3);camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(pos.clone().addScaledVector(behind,-30).add(new THREE.Vector3(0,1.7,0)));camera.fov=68}else{let dist=cameraMode===2?10:12,height=cameraMode===2?7:8;target=pos.clone().addScaledVector(behind,dist).add(new THREE.Vector3(0,height,0));camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(pos.clone().add(new THREE.Vector3(0,1,0)));camera.fov=65+Math.min(9,Math.abs(vehicle.speed)*.12)}camera.updateProjectionMatrix()}
function cull(){let p=player.position;for(let b of city.buildings){let d=Math.hypot(b.x-p.x,b.z-p.z);b.group.visible=d<(quality===0?180:quality===1?300:480)}for(let t of city.traffic)t.g.visible=t.g.position.distanceTo(player.position)<190;for(let p of city.peds)p.g.visible=p.g.position.distanceTo(player.position)<100}
function drawMap(){let c=$("mapCanvas"),ctx=c.getContext("2d");ctx.fillStyle="#172b2c";ctx.fillRect(0,0,800,800);ctx.strokeStyle="#58696a";ctx.lineWidth=10;for(let n=-4;n<=4;n++){let p=400+n*88;ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,800);ctx.stroke();ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(800,p);ctx.stroke()}ctx.fillStyle="#347d91";ctx.fillRect(735,0,65,800);ctx.fillStyle="#d8b86b";for(let s of city.shops){let x=400+s.x*.8,y=400+s.z*.8;ctx.fillRect(x-7,y-7,14,14)}ctx.fillStyle="#f4f0d1";ctx.beginPath();ctx.arc(400+player.position.x*.8,400+player.position.z*.8,9,0,7);ctx.fill();if(mission){ctx.strokeStyle="#f2b85b";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(400+player.position.x*.8,400+player.position.z*.8);ctx.lineTo(400+mission.x*.8,400+mission.z*.8);ctx.stroke();ctx.fillStyle="#ffcb6b";ctx.beginPath();ctx.arc(400+mission.x*.8,400+mission.z*.8,7,0,7);ctx.fill()}}
function update(dt){if(state!=="play")return;elapsed+=dt;physics(dt);updateTraffic(dt);updatePeds(dt);updateSignals();updateWeather(dt);updateDay(dt);if(elapsed>nextCull){cull();nextCull=elapsed+.7}cameraUpdate(dt);if(mission){mission.deadline-=dt;if(mission.deadline<=0){toast("انتهت مهلة العقد — تم إلغاء المهمة");mission=null;hud()}}if(Math.floor(elapsed)%12===0)persist();hud()}
function loop(t){let dt=Math.min(.045,(t-last)/1000||0);last=t;frameCount++;fpsTimer+=dt;if(fpsTimer>=1){fps=frameCount/fpsTimer;frameCount=0;fpsTimer=0;if(showFPS)$("fps").textContent="FPS: "+Math.round(fps)}update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener("resize",resize);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="play"){$("pause").click();persist()}});
$("qualityBtn").textContent="Q: "+["L","M","H"][quality];renderer.setPixelRatio(Math.min(devicePixelRatio,quality===0?.85:quality===1?1.2:1.6));renderer.shadowMap.enabled=quality>0;player.position.set(-45,0,-45);camera.position.set(-55,10,-60);camera.lookAt(player.position);mainMenu();hud();requestAnimationFrame(loop);
})();
</script>
