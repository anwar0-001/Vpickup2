function cull(){if(insideHome)return;const p=onFoot?walker.position:player.position,profile=qualityProfiles[quality]||qualityProfiles[1];for(const b of city.buildings){const d=Math.hypot(b.x-p.x,b.z-p.z);b.group.visible=d<profile.buildingDistance}for(const r of city.regions){const d=Math.hypot(r.x-p.x,r.z-p.z);r.group.visible=d<r.radius+profile.regionMargin}for(const t of city.traffic)t.g.visible=t.g.position.distanceTo(p)<profile.trafficDistance;for(const ped of city.peds)ped.g.visible=ped.g.position.distanceTo(p)<profile.pedestrianDistance}
function drawMap(){const c=$("mapCanvas"),ctx=c.getContext("2d"),loc=onFoot?walker.position:player.position,scale=.265,px=x=>400+x*scale,pz=z=>400+z*scale;ctx.fillStyle="#172b2c";ctx.fillRect(0,0,800,800);ctx.fillStyle="#347d91";ctx.fillRect(px(380),0,180*scale,800);ctx.fillStyle="#d5bd86";ctx.fillRect(px(650),pz(230),170*scale,90*scale);ctx.fillStyle="#b99a5d";ctx.fillRect(px(490),pz(550),450*scale,350*scale);ctx.fillStyle="#3e6843";ctx.fillRect(px(-1425),pz(-1240),850*scale,780*scale);ctx.fillStyle="#65794f";ctx.fillRect(px(-1295),pz(1360),950*scale,620*scale);ctx.fillStyle="#2c8294";ctx.beginPath();ctx.ellipse(px(-900),pz(390),205*scale,155*scale,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#8a9a9a";ctx.lineWidth=5;for(const r of city.roads){ctx.beginPath();if(r.w>r.d){ctx.moveTo(px(r.x-r.w/2),pz(r.z));ctx.lineTo(px(r.x+r.w/2),pz(r.z))}else{ctx.moveTo(px(r.x),pz(r.z-r.d/2));ctx.lineTo(px(r.x),pz(r.z+r.d/2))}ctx.stroke()}ctx.fillStyle="#f0d17d";for(const r of city.regions){ctx.beginPath();ctx.arc(px(r.x),pz(r.z),6,0,Math.PI*2);ctx.fill();ctx.font="bold 12px sans-serif";ctx.textAlign="center";ctx.fillText(r.name,px(r.x),pz(r.z)-11)}ctx.fillStyle="#d8b86b";for(const sh of city.shops)ctx.fillRect(px(sh.x)-4,pz(sh.z)-4,8,8);ctx.fillStyle="#9ef0c3";for(const h of homes){ctx.beginPath();ctx.arc(px(h.x),pz(h.z),save.homes[h.id]?7:5,0,Math.PI*2);ctx.fill()}if(mission){const gx=mission.stage==="pickup"?mission.x:40,gz=mission.stage==="pickup"?mission.z:40;ctx.strokeStyle="#f2b85b";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(px(loc.x),pz(loc.z));ctx.lineTo(px(gx),pz(gz));ctx.stroke();ctx.fillStyle="#ffcb6b";ctx.beginPath();ctx.arc(px(gx),pz(gz),8,0,7);ctx.fill()}ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(px(loc.x),pz(loc.z),9,0,7);ctx.fill();drawMiniMap()}
function drawMiniMap(){const c=$("miniMap"),ctx=c.getContext("2d"),s=240,scale=.34,loc=onFoot?walker.position:player.position;ctx.clearRect(0,0,s,s);ctx.fillStyle="#263d37";ctx.fillRect(0,0,s,s);ctx.fillStyle="#347d91";const waterX=(470-loc.x)*scale+120;ctx.fillRect(waterX-31,0,62,240);ctx.strokeStyle="#65706c";ctx.lineWidth=3;for(const r of city.roads){const x=(r.x-loc.x)*scale+120,z=(r.z-loc.z)*scale+120;if(x>-180&&x<420&&z>-180&&z<420){ctx.beginPath();if(r.w>r.d){ctx.moveTo(x-r.w*scale/2,z);ctx.lineTo(x+r.w*scale/2,z)}else{ctx.moveTo(x,z-r.d*scale/2);ctx.lineTo(x,z+r.d*scale/2)}ctx.stroke()}}if(mission){const mx=120+((mission.stage==="pickup"?mission.x:40)-loc.x)*scale,mz=120+((mission.stage==="pickup"?mission.z:40)-loc.z)*scale;ctx.fillStyle="#ffd36e";ctx.beginPath();ctx.arc(mx,mz,5,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(120,120,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(120,120);const heading=onFoot?walker.rotation.y:player.rotation.y;ctx.lineTo(120-Math.sin(heading)*18,120-Math.cos(heading)*18);ctx.stroke()}
function update(dt){if(state!=="play")return;elapsed+=dt;if(onFoot)walkUpdate(dt);else physics(dt);if(!insideHome){updateTraffic(dt);updatePeds(dt);} updateSignals();updateWeather(dt);updateDay(dt);if(elapsed>nextCull){cull();drawMiniMap();nextCull=elapsed+.7}cameraUpdate(dt);if(mission){mission.deadline-=dt;if(mission.deadline<=0){toast("انتهت مهلة العقد — تم إلغاء المهمة");for(let item of carried)if(item.parent)item.parent.remove(item);carried=[];mission=null;createMission();hud()}}if(Math.floor(elapsed)%12===0)persist();hud()}
function loop(t){let dt=Math.min(.045,(t-last)/1000||0);last=t;frameCount++;fpsTimer+=dt;if(fpsTimer>=1){fps=frameCount/fpsTimer;frameCount=0;fpsTimer=0;if(showFPS)$("fps").textContent="FPS: "+Math.round(fps)}update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener("resize",resize);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="play"){$("pause").click();persist()}});
applyQualitySettings();player.position.set(-45,0,-45);camera.position.set(-55,10,-60);camera.lookAt(player.position);mainMenu();hud();requestAnimationFrame(loop);
})();
</script>
