 for(const sig of signals){const d=Math.hypot(player.position.x-(sig.x+9),player.position.z-(sig.z+9));if(d<11&&absSpeed>5&&sig.lamp.material.color.getHex()===0xe34b45&&elapsed-lastFine>3){save.money=Math.max(0,save.money-35);lastFine=elapsed;toast("تجاوز إشارة حمراء: -35 ◈")}}
 for(const car of city.traffic){if(player.position.distanceTo(car.g.position)<3.2){vehicle.damage=clamp(vehicle.damage+absSpeed*.055,0,100);vehicle.speed*=-.22;vehicle.lateralSpeed*= -.2;car.speed*=.55;vibrate(70)}}

function updateTraffic(dt){for(const c of city.traffic){const g=c.g;let target=c.speed;const signal=signals.find(s=>Math.hypot(s.x-g.position.x,s.z-g.position.z)<12);if(signal&&signal.lamp.material.color.getHex()===0xe34b45)target=0;for(const p of city.peds){if(Math.hypot(p.g.position.x-g.position.x,p.g.position.z-g.position.z)<4.6){target=0;break}}let nearest=Infinity;for(const other of city.traffic){if(other===c||other.axis!==c.axis||other.dir!==c.dir||Math.abs(other.lane-c.lane)>1.25)continue;let gap=c.axis==="x"?(other.g.position.x-g.position.x)*c.dir:(other.g.position.z-g.position.z)*c.dir;if(gap<=0)gap+=880;if(gap>0&&gap<nearest)nearest=gap}if(nearest<28)target=Math.min(target,Math.max(0,(nearest-5)*.72));const playerPos=onFoot?walker.position:player.position;if(g.position.distanceTo(playerPos)<8)target=Math.min(target,Math.max(3,c.speed*.55));const braking=target<c.currentSpeed-.35;c.currentSpeed=THREE.MathUtils.damp(c.currentSpeed,target,braking?7:2.2,dt);const v=c.currentSpeed*c.dir*dt;if(c.axis==="x"){g.position.x+=v;g.rotation.y=c.dir>0?-Math.PI/2:Math.PI/2;if(g.position.x>440)g.position.x=-440;if(g.position.x< -440)g.position.x=440}else{g.position.z+=v;g.rotation.y=c.dir>0?Math.PI:0;if(g.position.z>440)g.position.z=-440;if(g.position.z< -440)g.position.z=440}for(const lamp of c.brakeLights)lamp.material.color.setHex(braking?0xff3024:0x721b18)}}
function updatePeds(dt){const target=onFoot?walker.position:player.position;for(let p of city.peds){let d=Math.hypot(target.x-p.g.position.x,target.z-p.g.position.z);if(d<9){p.wait=.6;p.dir=Math.atan2(p.g.position.x-target.x,p.g.position.z-target.z)}if(p.wait>0)p.wait-=dt;else{p.g.position.x+=Math.sin(p.dir)*p.speed*dt;p.g.position.z+=Math.cos(p.dir)*p.speed*dt}if(Math.abs(p.g.position.x)>430||Math.abs(p.g.position.z)>430)p.dir+=Math.PI;p.g.rotation.y=p.dir;p.phase+=dt*(p.wait>0?1.5:7);const swing=p.wait>0?0:Math.sin(p.phase)*.48;p.legs.forEach((l,i)=>l.rotation.x=(i===0?1:-1)*swing);p.arms.forEach((a,i)=>a.rotation.x=(i===0?-1:1)*swing*.7)}}
function updateSignals(){for(let s of signals){let green=Math.sin(elapsed*.22+s.phase)>-.2;s.lamp.material.color.setHex(green?0x38d27b:0xe34b45)}}
function setWeather(next,announce=true){

 weatherFogColorTarget.copy(weatherBgTarget);

}
function updateWeather(dt){

 if(weatherClock>85){weatherClock=0;setWeather(choose(["clear","clear","fog","rain"]));}
 const blend=1-Math.exp(-dt*0.42);

  const a=rainGeo.attributes.position;
  for(let i=0;i<rainCount;i++){

   a.array[p]+=rainWindX*dt;a.array[p+1]-=27*dt;a.array[p+2]+=rainWindZ*dt;
   a.array[p+3]+=rainWindX*dt;a.array[p+4]-=27*dt;a.array[p+5]+=rainWindZ*dt;

}
function updateDay(dt){if(insideHome||insideBuilding)return;dayClock=(dayClock+dt*.5)%(24*60);const phase=(dayClock/1440)*Math.PI*2,light=Math.max(.12,Math.sin(phase-Math.PI/2)*.8+.35),night=clamp((.36-light)/.24,0,1),dusk=clamp(1-Math.abs(light-.43)/.28,0,1)*(1-night);sun.position.set(Math.cos(phase)*150,Math.max(12,Math.sin(phase)*180),70);sun.intensity=light*2;hemi.intensity=.45+light;sun.color.setHSL(.1,.35,clamp(.65+light*.1,.4,.8));if(save.lights||light<.24)sun.intensity*=.8;headlamps.forEach(l=>l.intensity=(save.lights||light<.3)?2.2:0);const playerPos=onFoot?walker.position:player.position;stars.position.copy(playerPos);stars.visible=night>.025;stars.material.opacity=night;moon.visible=night>.04;moon.material.opacity=night;moon.position.set(playerPos.x-Math.cos(phase)*380,Math.max(125,Math.sin(phase)*220+180),playerPos.z-70);moonLight.position.copy(moon.position);moonLight.intensity=night*.38;cityLights.forEach(l=>l.intensity=night*.72);const sky=skyScratch.copy(weatherBgTarget).lerp(duskSkyColor,dusk*.48).lerp(nightSkyColor,night*.9),fog=fogScratch.copy(weatherFogColorTarget).lerp(nightFogColor,night*.78);scene.background.copy(sky);scene.fog.color.copy(fog)}
function cameraUpdate(dt){if(onFoot){const pos=walker.position.clone(),behind=new THREE.Vector3(Math.sin(walker.rotation.y),0,Math.cos(walker.rotation.y));if(underwaterMode){camera.position.lerp(pos.clone().addScaledVector(behind,5).add(new THREE.Vector3(0,2.2,0)),1-Math.pow(.001,dt));camera.lookAt(pos.clone().add(new THREE.Vector3(0,.4,0)));camera.fov=74;camera.updateProjectionMatrix();return}camera.position.lerp(pos.clone().addScaledVector(behind,(insideHome||insideBuilding)?4.2:7).add(new THREE.Vector3(0,(insideHome||insideBuilding)?2.7:4,0)),1-Math.pow(.001,dt));camera.lookAt(pos.clone().add(new THREE.Vector3(0,1.2,0)));camera.fov=68;camera.updateProjectionMatrix();return}const pos=player.position.clone(),behind=new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y)),smooth=1-Math.pow(.001,dt);let target;if(cameraMode===1){target=pos.clone().add(new THREE.Vector3(0,2.15,0)).addScaledVector(behind,-.3);camera.position.lerp(target,smooth);camera.lookAt(pos.clone().addScaledVector(behind,-30).add(new THREE.Vector3(0,1.7,0)));camera.fov=68}else if(cameraMode===2){const orbit=Math.sin(elapsed*.32)*.24+(vehicle.steer||0)*.07,co=Math.cos(orbit),si=Math.sin(orbit),sideBehind=new THREE.Vector3(behind.x*co+behind.z*si,0,behind.z*co-behind.x*si);target=pos.clone().addScaledVector(sideBehind,13).add(new THREE.Vector3(0,8.2+Math.sin(elapsed*.55)*.45,0));camera.position.lerp(target,smooth*.82);camera.lookAt(pos.clone().add(new THREE.Vector3(0,1.25,0)));camera.fov=67+Math.min(7,Math.abs(vehicle.speed)*.1)}else{target=pos.clone().addScaledVector(behind,12).add(new THREE.Vector3(0,8,0));camera.position.lerp(target,smooth);camera.lookAt(pos.clone().add(new THREE.Vector3(0,1,0)));camera.fov=65+Math.min(9,Math.abs(vehicle.speed)*.12)}camera.updateProjectionMatrix()}
function cull(){if(insideHome||insideBuilding)return;const p=onFoot?walker.position:player.position,profile=qualityProfiles[quality]||qualityProfiles[1];for(const b of city.buildings){const d=Math.hypot(b.x-p.x,b.z-p.z);b.group.visible=d<profile.buildingDistance}for(const r of city.regions){const d=Math.hypot(r.x-p.x,r.z-p.z);r.group.visible=d<r.radius+profile.regionMargin}for(const t of city.traffic)t.g.visible=t.g.position.distanceTo(p)<profile.trafficDistance;for(const ped of city.peds)ped.g.visible=ped.g.position.distanceTo(p)<profile.pedestrianDistance;railwayRoot.visible=Math.hypot(1080-p.x,-360-p.z)<profile.buildingDistance+720}
function drawMap(){const c=$("mapCanvas"),ctx=c.getContext("2d"),loc=onFoot?walker.position:player.position,scale=.265,px=x=>400+x*scale,pz=z=>400+z*scale;ctx.fillStyle="#172b2c";ctx.fillRect(0,0,800,800);ctx.fillStyle="#347d91";ctx.fillRect(px(380),0,180*scale,800);ctx.strokeStyle="#347d91";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(px(-900),pz(-130));ctx.lineTo(px(-900),pz(390));ctx.stroke();ctx.fillStyle="#d5bd86";ctx.fillRect(px(650),pz(230),170*scale,90*scale);ctx.fillStyle="#b99a5d";ctx.fillRect(px(490),pz(550),450*scale,350*scale);ctx.fillStyle="#3e6843";ctx.fillRect(px(-1425),pz(-1240),850*scale,780*scale);ctx.fillStyle="#65794f";ctx.fillRect(px(-1295),pz(1360),950*scale,620*scale);ctx.fillStyle="#2c8294";ctx.beginPath();ctx.ellipse(px(-900),pz(390),205*scale,155*scale,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#c7b78d";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px(1080),pz(-760));ctx.lineTo(px(1080),pz(30));ctx.stroke();ctx.strokeStyle="#8a9a9a";ctx.lineWidth=5;for(const r of city.roads){ctx.beginPath();if(r.w>r.d){ctx.moveTo(px(r.x-r.w/2),pz(r.z));ctx.lineTo(px(r.x+r.w/2),pz(r.z))}else{ctx.moveTo(px(r.x),pz(r.z-r.d/2));ctx.lineTo(px(r.x),pz(r.z+r.d/2))}ctx.stroke()}ctx.fillStyle="#f0d17d";for(const r of city.regions){ctx.beginPath();ctx.arc(px(r.x),pz(r.z),6,0,Math.PI*2);ctx.fill();ctx.font="bold 12px sans-serif";ctx.textAlign="center";ctx.fillText(r.name,px(r.x),pz(r.z)-11)}ctx.fillStyle="#c5a5df";for(const landmark of city.landmarks){ctx.beginPath();ctx.arc(px(landmark.x),pz(landmark.z),3.5,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#d8b86b";for(const sh of city.shops)ctx.fillRect(px(sh.x)-4,pz(sh.z)-4,8,8);ctx.fillStyle="#7bd6be";for(const site of enterableBuildings)ctx.fillRect(px(site.x)-3,pz(site.z)-3,6,6);ctx.fillStyle="#9ef0c3";for(const h of homes){ctx.beginPath();ctx.arc(px(h.x),pz(h.z),save.homes[h.id]?7:5,0,Math.PI*2);ctx.fill()}if(mission){const gx=mission.stage==="pickup"?mission.x:40,gz=mission.stage==="pickup"?mission.z:40;ctx.strokeStyle="#f2b function drawMiniMap(){const c=$("miniMap"),ctx=c.getContext("2d"),s=240,scale=.34,loc=onFoot?walker.position:player.position;ctx.clearRect(0,0,s,s);ctx.fillStyle="#263d37";ctx.fillRect(0,0,s,s);ctx.fillStyle="#347d91";const waterX=(470-loc.x)*scale+120;ctx.fillRect(waterX-31,0,62,240);ctx.strokeStyle="#65706c";ctx.lineWidth=3;for(const r of city.roads){const x=(r.x-loc.x)*scale+120,z=(r.z-loc.z)*scale+120;if(x>-180&&x<420&&z>-180&&z<420){ctx.beginPath();if(r.w>r.d){ctx.moveTo(x-r.w*scale/2,z);ctx.lineTo(x+r.w*scale/2,z)}else{ctx.moveTo(x,z-r.d*scale/2);ctx.lineTo(x,z+r.d*scale/2)}ctx.stroke()}}if(mission){const mx=120+((mission.stage==="pickup"?mission.x:40)-loc.x)*scale,mz=120+((mission.stage==="pickup"?mission.z:40)-loc.z)*scale;ctx.fillStyle="#ffd36e";ctx.beginPath();ctx.arc(mx,mz,5,0,Math.PI*2);ctx.fill()}if(waypoint){const wx=120+(waypoint.x-loc.x)*scale,wz=120+(waypoint.z-loc.z)*scale;ctx.strokeStyle="#9ef0c3";ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(120,120);ctx.lineTo(wx,wz);ctx.stroke();ctx.setLineDash([]);if(wx>=0&&wx<=240&&wz>=0&&wz<=240){ctx.fillStyle="#9ef0c3";ctx.beginPath();ctx.arc(wx,wz,5,0,Math.PI*2);ctx.fill()}}ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(120,120,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(120,120);const heading=onFoot?walker.rotation.y:player.rotation.y;ctx.lineTo(120-Math.sin(heading)*18,120-Math.cos(heading)*18);ctx.stroke()}
function update(dt){if(state!=="play")return;elapsed+=dt;if(onFoot)walkUpdate(dt);else physics(dt);if(!insideHome&&!insideBuilding&&!underwaterMode){updateTraffic(dt);updatePeds(dt);} updateSignals();updateRailTrain(dt);updateWeather(dt);updateDay(dt);if(underwaterMode){scene.background.set(0x06384d);scene.fog.color.set(0x0b5268);scene.fog.density=.042;sun.intensity=.22;hemi.intensity=.62}if(elapsed>nextCull){cull();if($("map").classList.contains("show"))drawMap();else drawMiniMap();nextCull=elapsed+.7}cameraUpdate(dt);if(mission){mission.deadline-=dt;if(mission.deadline<=0){toast("انتهت مهلة العقد — تم إلغاء المهمة");for(let item of carried)if(item.parent)item.parent.remove(item);carried=[];mission=null;createMission();hud()}}if(Math.floor(elapsed)%12===0)persist();if(elapsed>=nextHud){hud();nextHud=elapsed+.12}}
