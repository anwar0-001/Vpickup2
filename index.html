function drawMiniMap(){const c=$("miniMap"),ctx=c.getContext("2d"),s=240,scale=.34,loc=onFoot?walker.position:player.position;ctx.clearRect(0,0,s,s);ctx.fillStyle="#263d37";ctx.fillRect(0,0,s,s);ctx.fillStyle="#347d91";const waterX=(470-loc.x)*scale+120;ctx.fillRect(waterX-31,0,62,240);ctx.strokeStyle="#65706c";ctx.lineWidth=3;for(const r of city.roads){const x=(r.x-loc.x)*scale+120,z=(r.z-loc.z)*scale+120;if(x>-180&&x<420&&z>-180&&z<420){ctx.beginPath();if(r.w>r.d){ctx.moveTo(x-r.w*scale/2,z);ctx.lineTo(x+r.w*scale/2,z)}else{ctx.moveTo(x,z-r.d*scale/2);ctx.lineTo(x,z+r.d*scale/2)}ctx.stroke()}}if(mission){const mt=missionTarget()||{x:40,z:40},mx=120+(mt.x-loc.x)*scale,mz=120+(mt.z-loc.z)*scale;ctx.fillStyle="#ffd36e";ctx.beginPath();ctx.arc(mx,mz,5,0,Math.PI*2);ctx.fill()}if(emergencyIncident){const ex=120+(emergencyIncident.x-loc.x)*scale,ez=120+(emergencyIncident.z-loc.z)*scale;if(ex>=0&&ex<=240&&ez>=0&&ez<=240){ctx.strokeStyle="#ff9b68";ctx.lineWidth=2;ctx.beginPath();ctx.arc(ex,ez,7,0,Math.PI*2);ctx.stroke()}}if(worldEvent){const ex=120+(worldEvent.x-loc.x)*scale,ez=120+(worldEvent.z-loc.z)*scale;if(ex>=0&&ex<=240&&ez>=0&&ez<=240){ctx.strokeStyle="#7ce8c3";ctx.lineWidth=2;ctx.beginPath();ctx.arc(ex,ez,6,0,Math.PI*2);ctx.stroke()}}if(waypoint){const wx=120+(waypoint.x-loc.x)*scale,wz=120+(waypoint.z-loc.z)*scale;ctx.strokeStyle="#9ef0c3";ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(120,120);ctx.lineTo(wx,wz);ctx.stroke();ctx.setLineDash([]);if(wx>=0&&wx<=240&&wz>=0&&wz<=240){ctx.fillStyle="#9ef0c3";ctx.beginPath();ctx.arc(wx,wz,5,0,Math.PI*2);ctx.fill()}}ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(120,120,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(120,120);const heading=onFoot?walker.rotation.y:player.rotation.y;ctx.lineTo(120-Math.sin(heading)*18,120-Math.cos(heading)*18);ctx.stroke()}
function updateRaceMission(){if(!mission||mission.kind!=="race")return;const pos=onFoot?walker.position:player.position,checkpoint=mission.checkpoints[mission.checkpointIndex];if(checkpoint&&Math.hypot(pos.x-checkpoint.x,pos.z-checkpoint.z)<15){if(mission.markers[mission.checkpointIndex])mission.markers[mission.checkpointIndex].visible=false;mission.checkpointIndex++;if(mission.checkpointIndex>=mission.checkpoints.length){const reward=mission.reward;clearMissionExtras();save.money+=reward;score+=reward;save.high=Math.max(save.high,score);grantProgress(220,"firstRace");mission=null;persist();toast("فزت بسباق المدينة! +"+reward+" ◈");createMission()}else{mission.label="سباق المدينة — نقطة "+(mission.checkpointIndex+1)+" من "+mission.checkpoints.length;toast("تم اجتياز نقطة الفحص "+mission.checkpointIndex)}hud()}}
function update(dt){if(state!=="play")return;elapsed+=dt;if(onTrain){player.position.set(railTrain.position.x,1.85,railTrain.position.z+6)}else if(onFoot)walkUpdate(dt);else physics(dt);updateAudio();if(!insideHome&&!insideBuilding&&!underwaterMode){updateTraffic(dt);updatePeds(dt);}updatePolice(dt);updateNPCs(dt);updateWildlife(dt);updateSignals();updateRailTrain(dt);updateWeather(dt);updateDay(dt);updateSeason(dt);if(underwaterMode){scene.background.set(0x06384d);scene.fog.color.set(0x0b5268);scene.fog.density=.042;sun.intensity=.22;hemi.intensity=.62}if(elapsed>nextCull){cull();updateExploration();if($("map").classList.contains("show"))drawMap();else drawMiniMap();nextCull=elapsed+.7}cameraUpdate(dt);updateWorldEvent(dt);updateEmergencyServices(dt);if(mission&&mission.kind==="race")updateRaceMission();if(mission){mission.deadline-=dt;if(mission.deadline<=0){toast("انتهت مهلة العقد — تم إلغاء المهمة");for(let item of carried)if(item.parent)item.parent.remove(item);carried=[];clearMissionExtras();mission=null;createMission();hud()}}if(Math.floor(elapsed)%12===0)persist();if(elapsed>=nextHud){hud();nextHud=elapsed+.12}}
function loop(t){let dt=Math.min(.045,(t-last)/1000||0);last=t;frameCount++;fpsTimer+=dt;perfWindow+=dt;perfFrames++;if(fpsTimer>=1){fps=frameCount/fpsTimer;frameCount=0;fpsTimer=0;if(showFPS)$("fps").textContent="FPS: "+Math.round(fps)}if(perfWindow>=4){const average=perfFrames/perfWindow;perfWindow=0;perfFrames=0;if(save.autoPerformance&&state==="play"){if(average<27){perfLowStreak++;perfHighStreak=0}else if(average>52){perfHighStreak++;perfLowStreak=0}else{perfLowStreak=0;perfHighStreak=0}if(perfLowStreak>=2&&quality>0){quality--;perfLowStreak=0;applyQualitySettings(true);toast("تم خفض الجودة لحماية سلاسة اللعب")}else if(perfHighStreak>=3&&quality<2){quality++;perfHighStreak=0;applyQualitySettings(true);toast("تم رفع الجودة تدريجياً لتحسين الصورة")}}}update(dt);if(postComposer&&postReady){postTrail.enabled=quality>0;postBloom.strength=quality===0?.08:quality===1?.2:.28;if(postBokeh)postBokeh.enabled=quality===2&&cameraMode===2;postComposer.render()}else renderer.render(scene,camera);requestAnimationFrame(loop)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(postComposer)postComposer.setSize(innerWidth,innerHeight)}addEventListener("resize",resize);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="play"){$("pause").click();persist()}});
applySeason(seasonIndex,false);applyAccessibility();applyQualitySettings();player.position.set(-45,0,-45);camera.position.set(-55,10,-60);camera.lookAt(player.position);mainMenu();hud();requestAnimationFrame(loop);
})();
