<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#102b27">
<title>PICKUP DELIVERY</title>
<style>
:root{--bg:#102b27;--panel:#173a34;--mint:#a8f0c6;--yellow:#ffd166;--cream:#fff8e8;--muted:#b6d1c5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#83c47e}
.hud{position:fixed;z-index:3;top:env(safe-area-inset-top,8px);left:9px;right:9px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.stat{background:#102b27ed;border:1px solid #ffffff20;border-radius:13px;padding:6px 9px;min-width:65px;text-align:center;box-shadow:0 5px 18px #102b2730}.stat small{display:block;color:var(--muted);font-size:10px}.stat b{font-size:15px;font-variant-numeric:tabular-nums}
#cargoBar{height:5px;background:#ffffff25;border-radius:9px;margin-top:4px;overflow:hidden}#cargoFill{height:100%;width:0;background:var(--mint);transition:width .15s}
#joystick{position:fixed;z-index:4;bottom:calc(20px + env(safe-area-inset-bottom));left:20px;width:124px;height:124px;border-radius:50%;background:#102b2770;border:2px solid #ffffff55;box-shadow:inset 0 0 0 10px #ffffff0c;touch-action:none}
#stick{position:absolute;width:54px;height:54px;border-radius:50%;left:33px;top:33px;background:linear-gradient(145deg,#c8ffe0,#62c995);border:3px solid #ffffffaa;box-shadow:0 4px 12px #071b17aa;pointer-events:none}

.action{border:1px solid #ffffff55;background:#102b27dc;color:white;border-radius:14px;padding:11px 13px;font-weight:800;font-size:13px;box-shadow:0 5px 15px #071b1740;touch-action:manipulation}.action span{color:var(--yellow)}
#topButtons{position:fixed;z-index:5;top:calc(72px + env(safe-area-inset-top));left:11px;display:flex;gap:6px}#topButtons button{border:0;border-radius:10px;background:#102b27c9;color:#fff;padding:7px 10px;font-weight:700}
#overlay{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(145deg,#102b27dc,#102b27a8);backdrop-filter:blur(7px)}#overlay.hidden{display:none}
.card{width:min(440px,100%);max-height:90dvh;overflow:auto;background:linear-gradient(160deg,#20483e,#14352f);border:1px solid #ffffff30;border-radius:26px;padding:23px;text-align:center;box-shadow:0 22px 70px #061b17a8}
.logo{font-size:clamp(30px,9vw,48px);font-weight:1000;letter-spacing:-2px;color:var(--mint);line-height:1.05}.subtitle{color:var(--muted);line-height:1.7;margin:12px 0 20px}
.primary{border:0;border-radius:15px;padding:13px 22px;background:linear-gradient(135deg,#b7f6cf,#6bd39d);color:#103329;font-size:16px;font-weight:900;min-width:160px;touch-action:manipulation}
.secondary{border:1px solid #ffffff38;border-radius:13px;padding:10px 14px;background:#ffffff12;color:#fff;font-weight:800;margin:5px;touch-action:manipulation}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#ffffff0d;padding:11px;border-radius:13px;margin:8px 0;text-align:right}.row small{display:block;color:var(--muted);margin-top:3px}.price{color:var(--yellow);font-weight:900}
#toast{position:fixed;z-index:8;top:24%;left:50%;transform:translate(-50%,-10px);background:#102b27ed;border:1px solid #ffffff35;border-radius:99px;padding:9px 17px;font-weight:800;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}#toast.show{opacity:1;transform:translate(-50%,0)}
#levelBanner{position:fixed;z-index:3;top:22%;left:50%;transform:translateX(-50%);font-size:22px;font-weight:1000;text-shadow:0 3px 9px #102b27;pointer-events:none;opacity:0;transition:opacity .4s}#levelBanner.show{opacity:1}
@media(min-width:700px){#joystick{left:calc(50% - 320px)}#buttons{right:calc(50% - 320px)}}
</style></head><body>
<canvas id="game" aria-label="لعبة جمع وتوصيل الشحنات"></canvas>
<div class="hud"><div class="stat"><small>النقاط</small><b id="score">0</b></div><div class="stat"><small>الوقت</small><b id="timer">60</b></div><div class="stat"><small>الحمولة</small><b id="cargo">0/5</b><div id="cargoBar"><div id="cargoFill"></div></div></div><div class="stat"><small>العملات</small><b id="coins">0 🪙</b></div></div>

<div id="toast"></div><div id="levelBanner"></div><div id="overlay"><div class="card" id="panel"></div></div>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),canvas=$("game"),ctx=canvas.getContext("2d");
const WORLD={w:1900,h:1350},TYPES=[{id:"common",name:"عادية",value:10,weight:1,color:"#f4d35e",chance:.66},{id:"rare",name:"نادرة",value:25,weight:1,color:"#55c7ed",chance:.26},{id:"valuable",name:"ثمينة",value:55,weight:2,color:"#d79bff",chance:.08}];
const SAVEKEY="pickupDeliverySave_v1";let saved={coins:0,high:0,speed:0,capacity:0,magnet:0};try{saved=Object.assign(saved,JSON.parse(localStorage.getItem(SAVEKEY)||"{}"))}catch(e){}
let W=0,H=0,dpr=1,camera={x:0,y:0},state="menu",score=0,level=1,timeLeft=60,elapsed=0,deliveriesThisLevel=0,shake=0,items=[],obstacles=[],particles=[],floaters=[],last=0,muted=false,audio=null;
let player={x:260,y:260,vx:0,vy:0,angle:0,cargo:[],radius:19},drop={x:1630,y:1100,r:58},input={x:0,y:0},joyActive=false,joyPointer=null;
const maxCargo=()=>5+saved.capacity*2,speedBase=()=>205+saved.speed*22,rand=(a,b)=>a+Math.random()*(b-a);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();
function save(){try{localStorage.setItem(SAVEKEY,JSON.stringify(saved))}catch(e){}}
function sound(freq,duration,type,vol){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type||"sine";o.frequency.value=freq||620;g.gain.setValueAtTime(vol||.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+(duration||.08));o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+(duration||.08))}catch(e){}}
function toast(msg){let el=$("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1400)}
function banner(msg){let el=$("levelBanner");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1300)}
function makeWorld(){obstacles=[];for(let i=0;i<30+level*4;i++){let x=rand(90,WORLD.w-90),y=rand(90,WORLD.h-90);if(Math.hypot(x-player.x,y-player.y)<170||Math.hypot(x-drop.x,y-drop.y)<130)continue;obstacles.push({x,y,r:rand(18,32),type:Math.random()<.78?"tree":"rock"})}items=[];for(let i=0;i<Math.min(32+level*3,70);i++)spawnItem()}
function spawnItem(){let x,y,tries=0;do{x=rand(70,WORLD.w-70);y=rand(70,WORLD.h-70);tries++}while(tries<40&&(Math.hypot(x-player.x,y-player.y)<110||Math.hypot(x-drop.x,y-drop.y)<110||obstacles.some(o=>Math.hypot(x-o.x,y-o.y)<o.r+30)));let roll=Math.random(),sum=0,t=TYPES[0];for(const v of TYPES){sum+=v.chance;if(roll<=sum){t=v;break}}items.push({x,y,type:t,bob:rand(0,6.28)})}
function startGame(){score=0;level=1;timeLeft=60;elapsed=0;deliveriesThisLevel=0;player={x:260,y:260,vx:0,vy:0,angle:0,cargo:[],radius:19};drop={x:WORLD.w-270,y:WORLD.h-250,r:58};makeWorld();state="playing";$("overlay").classList.add("hidden");banner("المستوى 1");updateHud();sound(520,.1)}
function beginLevel(){timeLeft=Math.max(24,66-(level-1)*5);elapsed=0;deliveriesThisLevel=0;player.x=260;player.y=260;player.vx=player.vy=0;player.cargo=[];makeWorld();state="playing";$("overlay").classList.add("hidden");banner("المستوى "+level);updateHud()}
function endGame(won){state="end";let earned=Math.floor(score/8)+(won?level*8:0);saved.coins+=earned;saved.high=Math.max(saved.high,score);save();sound(won?880:180,.22,"triangle");showEnd(won,earned)}
function loadWeight(){return player.cargo.reduce((a,x)=>a+x.type.weight,0)}

function addParticles(x,y,color,n){for(let i=0;i<(n||10);i++)particles.push({x,y,vx:rand(-100,100),vy:rand(-120,50),life:rand(.35,.75),max:.75,color,size:rand(2,5)})}

function collect(it){if(loadWeight()+it.type.weight>maxCargo()){toast("الحمولة ممتلئة! سلّم الشحنات أولاً");return false}player.cargo.push(it);items=items.filter(x=>x!==it);sound(it.type.id==="valuable"?920:it.type.id==="rare"?760:620,.07);addParticles(it.x,it.y,it.type.color,8);return true}
function deliver(){if(state!=="playing")return;if(Math.hypot(player.x-drop.x,player.y-drop.y)>drop.r+30){toast("اقترب من نقطة التسليم أولاً");return}if(!player.cargo.length){toast("لا توجد شحنات للتسليم");return}let points=0,coins=0;for(const it of player.cargo){points+=it.type.value;coins+=Math.ceil(it.type.value/8)}score+=points;saved.coins+=coins;addParticles(drop.x,drop.y,"#ffd166",32);for(let i=0;i<8;i++)addFloater(drop.x+rand(-35,35),drop.y+rand(-20,20),"+"+Math.ceil(coins/8)+" 🪙","#ffe08a");player.cargo=[];shake=8;sound(1040,.2,"triangle");save();toast("تسليم ناجح! +"+points+" نقطة");deliveriesThisLevel++;updateHud();if(deliveriesThisLevel>=2){state="shop";$("overlay").classList.remove("hidden");$("panel").innerHTML='<div class="logo" style="font-size:34px">اكتمل المستوى! 🎉</div><p class="subtitle">أنجزت عمليتي تسليم. جهّز مركبتك للمستوى التالي.</p>'+shopHTML();return}if(items.length<10)for(let i=0;i<12;i++)spawnItem()}
function shopHTML(){let up=[["speed","🚀 زيادة السرعة","تزيد سرعة المركبة",80+saved.speed*65],["capacity","📦 سعة أكبر","تضيف خانتين للحمولة",90+saved.capacity*75],["magnet","🧲 مغناطيس الشحنات","يجذب العناصر القريبة تلقائياً",150+saved.magnet*130]];let h='<div class="logo" style="font-size:34px">متجر التطوير</div><p class="subtitle">رصيدك: <b style="color:#ffd166">'+saved.coins+' 🪙</b><br>طوّر مركبتك قبل المستوى التالي.</p>';up.forEach(a=>{h+='<div class="row"><div><b>'+a[1]+'</b><small>'+a[2]+' · المستوى '+saved[a[0]]+'</small></div><button class="secondary" data-buy="'+a[0]+'" data-cost="'+a[3]+'">'+a[3]+' 🪙</button></div>'});return h+'<button class="primary" id="continueBtn">متابعة اللعب</button>'}
function openShop(){state="shop";$("overlay").classList.remove("hidden");$("panel").innerHTML=shopHTML()}
function buy(kind,cost){if(saved.coins<cost){toast("عملات غير كافية");return}saved.coins-=cost;saved[kind]++;save();$("panel").innerHTML=shopHTML();updateHud();sound(780,.1)}
function showMenu(){state="menu";$("overlay").classList.remove("hidden");$("panel").innerHTML='<div class="logo">PICKUP<br>DELIVERY</div><p class="subtitle">اجمع الشحنات من أنحاء الخريطة، ثم أوصلها إلى مركز التسليم قبل انتهاء الوقت!<br>كلما زادت الحمولة أصبحت مركبتك أبطأ.</p><div class="row"><span>🏆 أفضل نتيجة</span><b>'+saved.high+'</b></div><div class="row"><span>🪙 العملات</span><b>'+saved.coins+'</b></div><button class="primary" id="startBtn">ابدأ اللعب</button><p style="color:#b6d1c5;font-size:12px;margin-top:16px">حرّك العصا على اليسار للتوجيه · اقترب من الشحنات لجمعها</p>'}
function showEnd(won,earned){$("overlay").classList.remove("hidden");$("panel").innerHTML='<div class="logo" style="font-size:36px">'+(won?"أحسنت! 🎉":"انتهى الوقت!")+'</div><p class="subtitle">'+(won?"أكملت المستوى بنجاح.":"حاول جمع شحنات أكثر وتسليمها بسرعة.")+'</p><div class="row"><span>النقاط</span><b>'+score+'</b></div><div class="row"><span>أفضل نتيجة</span><b>'+saved.high+'</b></div><div class="row"><span>مكافأة العملات</span><b style="color:#ffd166">+'+earned+' 🪙</b></div><button class="primary" id="restartBtn">إعادة اللعب</button><button class="secondary" id="shopBtn">🛒 المتجر</button>'}
$("panel").addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.id==="startBtn")startGame();if(b.id==="restartBtn")startGame();if(b.id==="shopBtn")openShop();if(b.id==="continueBtn"){level++;beginLevel()}if(b.dataset.buy)buy(b.dataset.buy,+b.dataset.cost);if(b.id==="resumeBtn"){state="playing";$("overlay").classList.add("hidden")}if(b.id==="quitBtn")endGame(false)});
function togglePause(){if(state==="playing"){state="pause";$("overlay").classList.remove("hidden");$("panel").innerHTML='<div class="logo" style="font-size:36px">استراحة</div><p class="subtitle">اللعبة متوقفة مؤقتاً.</p><button class="primary" id="resumeBtn">متابعة</button><button class="secondary" id="quitBtn">إنهاء الجولة</button>'}else if(state==="pause"){state="playing";$("overlay").classList.add("hidden")}}
$("pauseBtn").addEventListener("click",togglePause);$("soundBtn").addEventListener("click",()=>{muted=!muted;$("soundBtn").textContent=muted?"🔇":"🔊";if(!muted)sound(600,.06)});$("deliverBtn").addEventListener("click",deliver);$("magnetBtn").addEventListener("click",()=>{if(!saved.magnet)toast("اشترِ المغناطيس من المتجر أولاً");else toast("المغناطيس يعمل تلقائياً 🧲")});
const joy=$("joystick"),stick=$("stick");function setJoy(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),max=42;if(len>max){dx=dx/len*max;dy=dy/len*max}input.x=dx/max;input.y=dy/max;stick.style.transform="translate("+dx+"px,"+dy+"px)"}
function stopJoy(){joyActive=false;joyPointer=null;input.x=input.y=0;stick.style.transform="translate(0,0)"}
joy.addEventListener("pointerdown",e=>{e.preventDefault();joy.setPointerCapture(e.pointerId);joyActive=true;joyPointer=e.pointerId;setJoy(e)});joy.addEventListener("pointermove",e=>{if(joyActive&&e.pointerId===joyPointer)setJoy(e)});joy.addEventListener("pointerup",stopJoy);joy.addEventListener("pointercancel",stopJoy);
const keys={};addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))e.preventDefault();if(e.key===" "&&state==="playing")deliver()});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
function update(dt){if(state!=="playing")return;elapsed+=dt;timeLeft-=dt;if(timeLeft<=0){timeLeft=0;updateHud();endGame(false);return}
 let kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),ix=input.x||kx,iy=input.y||ky,mag=Math.hypot(ix,iy);if(mag>1){ix/=mag;iy/=mag}
 let factor=Math.max(.48,1-loadWeight()/(maxCargo()+2)*.48),speed=speedBase()*factor;player.vx+=(ix*speed-player.vx)*Math.min(1,dt*8);player.vy+=(iy*speed-player.vy)*Math.min(1,dt*8);if(mag<.05){player.vx*=Math.pow(.04,dt);player.vy*=Math.pow(.04,dt)}if(Math.hypot(player.vx,player.vy)>8)player.angle=Math.atan2(player.vy,player.vx);
 let nx=Math.max(35,Math.min(WORLD.w-35,player.x+player.vx*dt)),ny=Math.max(35,Math.min(WORLD.h-35,player.y+player.vy*dt));for(const o of obstacles){let dx=nx-o.x,dy=ny-o.y,d=Math.hypot(dx,dy),min=o.r+17;if(d<min){let a=Math.atan2(dy,dx);nx=o.x+Math.cos(a)*min;ny=o.y+Math.sin(a)*min;player.vx*=.45;player.vy*=.45;shake=Math.max(shake,2)}}player.x=nx;player.y=ny;
 let magnetRange=saved.magnet?85+saved.magnet*28:0;for(const it of [...items]){let dx=player.x-it.x,dy=player.y-it.y,d=Math.hypot(dx,dy);if(magnetRange&&d<magnetRange){it.x+=dx/d*Math.min(d,220*dt);it.y+=dy/d*Math.min(d,220*dt);d=Math.hypot(player.x-it.x,player.y-it.y)}if(d<30)collect(it)}
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);floaters.forEach(f=>{f.y-=35*dt;f.life-=dt});floaters=floaters.filter(f=>f.life>0);
 camera.x=Math.max(0,Math.min(WORLD.w-W,player.x-W/2));camera.y=Math.max(0,Math.min(WORLD.h-H,player.y-H/2));shake=Math.max(0,shake-25*dt);if(items.length<16)for(let i=0;i<Math.min(3,20-items.length);i++)spawnItem();updateHud();if(Math.hypot(player.x-drop.x,player.y-drop.y)<drop.r+25&&player.cargo.length&&elapsed%1<dt)toast("اضغط تسليم الحمولة!");
}
function rr(c,x,y,w,h,r,fill,stroke){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.stroke()}}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);let sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;ctx.save();ctx.translate(-camera.x+sx,-camera.y+sy);ctx.fillStyle="#83c47e";ctx.fillRect(0,0,WORLD.w,WORLD.h);
 ctx.globalAlpha=.12;ctx.fillStyle="#376f48";for(let x=20;x<WORLD.w;x+=70)for(let y=20;y<WORLD.h;y+=70){ctx.beginPath();ctx.arc(x+(y%3)*7,y,2,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 ctx.fillStyle="#b9b4a0";ctx.fillRect(0,600,WORLD.w,120);ctx.fillRect(850,0,130,WORLD.h);ctx.fillRect(250,250,950,80);ctx.strokeStyle="#eee4c5";ctx.lineWidth=3;ctx.setLineDash([24,20]);ctx.beginPath();ctx.moveTo(0,660);ctx.lineTo(WORLD.w,660);ctx.moveTo(915,0);ctx.lineTo(915,WORLD.h);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle="#173c32";ctx.beginPath();ctx.arc(drop.x,drop.y,drop.r+12,0,Math.PI*2);ctx.fill();ctx.fillStyle="#e8f6d4";ctx.beginPath();ctx.arc(drop.x,drop.y,drop.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#f5c451";ctx.lineWidth=6;ctx.setLineDash([10,8]);ctx.beginPath();ctx.arc(drop.x,drop.y,drop.r-5,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="#1d4b3b";ctx.textAlign="center";ctx.font="bold 18px system-ui";ctx.fillText("📦",drop.x,drop.y+5);ctx.font="bold 12px system-ui";ctx.fillText("التسليم",drop.x,drop.y+27);
