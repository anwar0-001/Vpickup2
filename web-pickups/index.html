<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pickups — Open World</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game"></div>
<header><div class="logo">PICKUPS <small>MINI OPEN WORLD</small></div><div id="status">جارٍ تحميل المدينة...</div></header>
<aside id="mission"><b>مهمة سريعة</b><p id="missionText">توجّه إلى العلامة الذهبية.</p><div class="bar"><i id="timer"></i></div></aside>
<aside id="controls"><b>التحكم</b><span>W A S D — حركة / قيادة</span><span>Shift — ركض / تسارع</span><span>Space — قفز / فرامل</span><span>F أو E — ركوب / نزول</span><span>اسحب بالفأرة — تدوير الكاميرا</span><span>N — نهار / ليل</span></aside>
<div id="prompt"></div><div id="message"></div>
<div id="touchControls" aria-label="عناصر التحكم باللمس">
  <button data-key="KeyW" aria-label="تقدم">▲</button><button data-key="KeyA" aria-label="يسار">◀</button><button data-key="Space" aria-label="قفز أو فرامل">●</button><button data-key="KeyD" aria-label="يمين">▶</button><button data-key="KeyS" aria-label="تراجع">▼</button><button data-key="KeyF" aria-label="ركوب أو نزول">🚗</button>
</div>
<script type="module" src="game.js"></script>
</body></html>
